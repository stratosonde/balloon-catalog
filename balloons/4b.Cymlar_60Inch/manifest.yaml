conclusions: Cymlar 60″ 4-gore balloon (23 µm BoPET) burst at ~0.55 PSI after 19 pressure cycles on second
  inflation. Lower burst pressure than first inflation (4a reached 0.425 PSI without bursting), consistent
  with plastic deformation and material fatigue from the first cycle.
methods: Stereo vision with dual cameras. FoundationStereo depth estimation. DIC subset tracking (IC-GN)
  on rectified images. Kabsch alignment for rigid-body removal. Green-Lagrange strain via Delaunay triangulation.
