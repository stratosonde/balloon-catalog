conclusions: First inflation of virgin Cymlar 60-inch 4-gore balloon (23 µm BoPET). Reached 0.425 PSI
  / 40.3 inch diameter before camera power failure ended the test. The balloon did not burst. Deflated
  and re-inflated as 4b to compare first vs second inflation behavior.
